server.port=8084

# ── RedisLite Cache Configuration ──────────────────────────────────────────────
# Maximum number of keys the cache will hold before LRU eviction kicks in
redislite.cache.capacity=100

# How often (in seconds) the background TTL cleanup job runs
redislite.cache.ttl-cleanup-interval-seconds=5

# ── Spring Actuator ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.application.name=RedisLite
